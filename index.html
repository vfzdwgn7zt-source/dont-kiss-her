<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070609">
<title>DON'T KISS HER</title>
<style>
html,body{margin:0;background:#070609;color:#f2eded;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Mincho ProN","Yu Mincho",serif}
*{box-sizing:border-box} button{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.frame{min-height:100vh;background:#0b090c;border-left:1px solid #3c252b;border-right:1px solid #3c252b;box-shadow:0 0 30px rgba(100,0,25,.3)}
.title-img{width:100%;display:block;max-height:64vh;object-fit:cover;object-position:top center}
.title-buttons,.menu{padding:14px 18px 28px}
.title-btn,.choice{width:100%;display:block;text-decoration:none;text-align:center;margin:9px 0;padding:16px;border:1px solid #8a635f;background:linear-gradient(#4b111b,#21090e);box-shadow:inset 0 0 0 2px #13080b,0 3px 0 #050405;color:#fff;font-weight:700;font-size:18px;text-shadow:0 2px 2px #000}
.title-btn:active,.choice:active{transform:translateY(1px);filter:brightness(1.15)}
.top{display:flex;justify-content:space-between;gap:8px;padding:14px 16px;background:#100e12;border-bottom:1px solid #57353a}
.loc{font-size:19px;font-weight:700}.stat{font-size:11px;color:#c0b4b7;align-self:center}
.hero{width:100%;aspect-ratio:4/3;background:#050506 center/cover no-repeat;border-bottom:1px solid #503137}
.story{padding:15px 16px 12px;background:#0d0b0f;border-bottom:1px solid #38272c}
.story h1{margin:0;text-align:center;font-size:27px;letter-spacing:.06em}.sub{text-align:center;color:#cb6073;margin:5px 0 12px}
.textbox{padding:14px;border:1px solid #4b373b;background:#151116;line-height:1.8;white-space:pre-line;font-size:15px}
.speaker{color:#ee8299;font-weight:700;margin-bottom:5px}
.choices{padding:12px 16px 10px;background:#09080b}.choices h2{text-align:center;color:#c85e70;font-size:17px;letter-spacing:.1em}
.choice.danger{background:linear-gradient(#891c37,#340b16);border-color:#c46178}
.footer{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px 14px;background:#09080b;border-top:1px solid #34272a}
.mini{padding:12px 3px;border:1px solid #5d4a4d;background:#171418;font-size:12px;font-weight:700}
.screen-title{text-align:center;font-size:39px;margin:14px 0 4px}.screen-sub{text-align:center;color:#c05668;margin-bottom:15px}
.slot,.row,.item{border:1px solid #60474c;background:#181116;padding:13px;margin:9px 0}.small{font-size:12px;color:#afa3a7;margin-top:4px}
.gameover .screen-title{font-size:46px;color:#f0b0bf}.gameover .hero{aspect-ratio:1/1}
.notice{padding:12px;color:#cbbfc2;font-size:13px;text-align:center}

.compat{margin:10px 18px 20px;padding:12px;border:1px solid #69434b;background:#130d11;color:#d7c9cc;font-size:13px;line-height:1.6}
.compat strong{color:#ef9caf}
</style>
</head>

function clone(x){return JSON.parse(JSON.stringify(x))}
function read(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
var state={scene:"foyer",inventory:[],flags:{},playTime:0,startedAt:Date.now()};
var meta=read("dkh_meta",{endings:[],gameovers:[]});
var saves=read("dkh_saves",[null,null,null]);
var autosave=read("dkh_auto",null);
function saveMeta(){try{localStorage.setItem("dkh_meta",JSON.stringify(meta))}catch(e){}}
function updateTime(){state.playTime+=Math.max(0,Math.floor((Date.now()-state.startedAt)/1000));state.startedAt=Date.now()}
function saveAuto(){updateTime();autosave=clone(state);try{localStorage.setItem("dkh_auto",JSON.stringify(autosave))}catch(e){}}
function has(x){return state.inventory.indexOf(x)>=0}
function addItem(x){if(!has(x))state.inventory.push(x)}
function go(id){state.scene=id;state.startedAt=Date.now();saveAuto();render()}
function recordGO(id){if(meta.gameovers.indexOf(id)<0){meta.gameovers.push(id);saveMeta()}}
function recordEnd(id){if(meta.endings.indexOf(id)<0){meta.endings.push(id);saveMeta()}}
function locOf(id){return scenes[id]?scenes[id].loc:id}
function fmt(s){var m=Math.floor((s||0)/60),q=(s||0)%60;return ("0"+m).slice(-2)+":"+("0"+q).slice(-2)}

function dynamicChoices(id){
 if(id==="study_door"){
   return has("錆びた書斎の鍵")?[["【錆びた書斎の鍵】を使う","study"],["廊下へ戻る","upper_hall"]]:[["鍵が必要だ","upper_hall"]];
 }
 if(id==="finale"){
   var a=[["彼女を突き放して去る","ENDING","N2"],["逃げる","ENDING","N1"]];
   if(state.flags.truth && state.flags.diary)a.unshift(["彼女にキスする","ENDING",has("古い口紅")?"G1":"G3"]);
   return a;
 }
 return scenes[id].choices;
}
function render(){
 var s=scenes[state.scene]; if(!s){renderTitle();return}
 var img=s.img?IMG[s.img]:"";
 var ch=dynamicChoices(state.scene);
 var h='<div class="frame"><div class="top"><div class="loc">'+s.loc+'</div><div class="stat">ITEM '+state.inventory.length+' / 20　END '+meta.endings.length+' / 13</div></div>';
 if(img)h+='<div class="hero" style="background-image:url('+JSON.stringify(img)+')"></div>';
 h+='<div class="story"><h1>'+s.title+'</h1><div class="sub">'+(s.sub||"")+'</div><div class="textbox">'+(s.speaker?'<div class="speaker">'+s.speaker+'</div>':'')+s.text.replace(/\n/g,'<br>')+'</div></div>';
 h+='<div class="choices"><h2>― 選択肢 ―</h2>';
 for(var i=0;i<ch.length;i++){var d=ch[i][0].indexOf("【危険】")>=0?" danger":"";h+='<button class="choice'+d+'" onclick="choose('+i+')">'+ch[i][0]+'</button>'}
 h+='</div><div class="footer"><button class="mini" onclick="renderSave()">SAVE</button><button class="mini" onclick="renderLoad()">LOAD</button><button class="mini" onclick="renderItems()">ITEM</button><button class="mini" onclick="renderMenu()">MENU</button></div></div>';
 document.getElementById("app").innerHTML=h; window.scrollTo(0,0);
}
function choose(i){
 var c=dynamicChoices(state.scene)[i],t=c[1];
 if(t==="GAMEOVER"){gameover(c[2]);return}
 if(t==="ENDING"){ending(c[2]);return}
 if(t==="FUNC"){runFunc(c[2]);return}
 go(t);
}
function runFunc(x){
 if(x==="getkey"){addItem("錆びた書斎の鍵");state.flags.key=true;go("item_get_key")}
 else if(x==="fork"){addItem("銀のフォーク");go("upper_hall")}
 else if(x==="diary"){addItem("日記の切れ端");state.flags.diary=true;go("study_after_diary")}
 else if(x==="escapeCharm"){if(has("銀のフォーク"))go("charm_escape");else gameover("GO05")}
 else if(x==="lipstick"){addItem("古い口紅");state.flags.lipstick=true;go("guestroom_after")}
 else if(x==="frontEnd"){ending(state.flags.diary?"N1":"B7")}
 else if(x==="truth"){state.flags.truth=true;go("basement_truth")}
}
function gameover(id){
 recordGO(id);updateTime();
 var name=id;for(var i=0;i<GOS.length;i++)if(GOS[i][0]===id)name=GOS[i][1];
 document.getElementById("app").innerHTML='<div class="frame gameover"><div class="top"><div class="loc">'+id+'</div><div class="stat">GAME OVER</div></div><div class="hero" style="background-image:url('+JSON.stringify(IMG.charm)+')"></div><div class="story"><div class="screen-title">GAME OVER</div><div class="screen-sub">'+name+'</div><div class="textbox">唇が触れた瞬間、音が消えた。<br>暗闇の中で、彼女だけが近い。<br>最後に残ったのは、甘い吐息と口づけの記憶だった。</div></div><div class="choices"><button class="choice danger" onclick="loadAuto()">直前から再開</button><button class="choice" onclick="renderLoad()">セーブからロード</button><button class="choice" onclick="renderGameOvers()">GAME OVER COLLECTION</button><button class="choice" onclick="renderTitle()">タイトルへ戻る</button></div></div>';
}
function ending(id){
 recordEnd(id);updateTime();
 var e=null;for(var i=0;i<ENDINGS.length;i++)if(ENDINGS[i][0]===id)e=ENDINGS[i];
 var txt=id==="G1"?"彼女の唇に、自分の意思で触れた。<br>今度は暗闇ではなく、朝の光が戻ってきた。":id==="G3"?"最後までキスはしなかった。<br>扉が閉じる直前、彼女は小さく笑った。":id==="N1"?"鎖は外れた。<br>答えをすべて知ることはできなかった。<br>それでも、あなたは屋敷の外へ出た。":id==="N2"?"彼女を屋敷に残し、扉を閉じた。<br>正しかったのかは分からない。":"家に帰った夜。<br>眠りかけた唇に、柔らかな感触。<br>『見つけた。』";
 document.getElementById("app").innerHTML='<div class="frame"><div class="top"><div class="loc">'+e[1]+'</div><div class="stat">ENDING '+meta.endings.length+' / 13</div></div><div class="hero" style="background-image:url('+JSON.stringify(IMG.normal)+')"></div><div class="story"><div class="screen-title">'+e[1]+'</div><div class="screen-sub">'+e[2]+'</div><div class="textbox">'+txt+'</div></div><div class="choices"><button class="choice" onclick="renderArchive()">ENDING ARCHIVE</button><button class="choice" onclick="loadAuto()">分岐直前から再開</button><button class="choice" onclick="renderTitle()">タイトルへ戻る</button></div></div>';
}
function renderTitle(){
 document.getElementById("app").innerHTML='<div class="frame"><img class="title-img" src="'+IMG.title+'"><div class="title-buttons"><a class="title-btn" href="#game-start" id="btn-start">ゲームスタート</a><a class="title-btn" href="#archive" id="btn-archive">エンディングを見る</a><a class="title-btn" href="#save" id="btn-save">セーブ</a><a class="title-btn" href="#load" id="btn-load">ロード</a><div class="notice">iPhone Safari対応・開発版 v0.3</div><div class="compat"><strong>ボタン確認:</strong> タップするとURL末尾が変わります。ゲーム本体はJavaScriptが許可されたSafari上で動作します。</div></div></div>';
}
function newGame(){state={scene:"foyer",inventory:[],flags:{},playTime:0,startedAt:Date.now()};saveAuto();render()}
function saveSlot(i){updateTime();saves[i]=clone(state);try{localStorage.setItem("dkh_saves",JSON.stringify(saves))}catch(e){}renderSave()}
function loadSlot(i){if(saves[i]){state=clone(saves[i]);state.startedAt=Date.now();render()}}
function loadAuto(){if(autosave){state=clone(autosave);state.startedAt=Date.now();render()}else renderTitle()}
function renderSave(){
 updateTime();var h='<div class="frame menu"><div class="screen-title">SAVE</div><div class="screen-sub">進行を保存します</div>';
 for(var i=0;i<3;i++){h+='<div class="slot"><strong>SLOT 0'+(i+1)+'</strong><div class="small">'+(saves[i]?locOf(saves[i].scene)+' / '+fmt(saves[i].playTime):'EMPTY')+'</div><button class="choice" onclick="saveSlot('+i+')">ここにセーブ</button></div>'}
 h+='<button class="choice" onclick="renderTitle()">閉じる</button></div>';document.getElementById("app").innerHTML=h;
}
function renderLoad(){
 var h='<div class="frame menu"><div class="screen-title">LOAD</div><div class="screen-sub">進行を読み込みます</div>';
 for(var i=0;i<3;i++){h+='<div class="slot"><strong>SLOT 0'+(i+1)+'</strong><div class="small">'+(saves[i]?locOf(saves[i].scene)+' / '+fmt(saves[i].playTime):'EMPTY')+'</div>'+(saves[i]?'<button class="choice" onclick="loadSlot('+i+')">ロード</button>':'')+'</div>'}
 h+='<div class="slot"><strong>AUTO SAVE</strong><div class="small">'+(autosave?locOf(autosave.scene)+' / '+fmt(autosave.playTime):'EMPTY')+'</div>'+(autosave?'<button class="choice" onclick="loadAuto()">ロード</button>':'')+'</div><button class="choice" onclick="renderTitle()">閉じる</button></div>';document.getElementById("app").innerHTML=h;
}
function renderItems(){
 var h='<div class="frame menu"><div class="screen-title">ITEM</div><div class="screen-sub">所持品</div>';
 if(!state.inventory.length)h+='<div class="item">まだ何も持っていない。</div>';
 for(var i=0;i<state.inventory.length;i++)h+='<div class="item"><strong>'+state.inventory[i]+'</strong></div>';
 h+='<button class="choice" onclick="render()">閉じる</button></div>';document.getElementById("app").innerHTML=h;
}
function renderArchive(){
 var h='<div class="frame menu"><div class="screen-title">ENDING ARCHIVE</div><div class="screen-sub">END '+meta.endings.length+' / 13</div>';
 for(var i=0;i<ENDINGS.length;i++){var e=ENDINGS[i],ok=meta.endings.indexOf(e[0])>=0;h+='<div class="row"><strong>'+(ok?e[1]+'　'+e[2]:'🔒　????????')+'</strong></div>'}
 h+='<button class="choice" onclick="renderGameOvers()">GAME OVER COLLECTION</button><button class="choice" onclick="renderTitle()">閉じる</button></div>';document.getElementById("app").innerHTML=h;
}
function renderGameOvers(){
 var h='<div class="frame menu"><div class="screen-title">GAME OVER COLLECTION</div><div class="screen-sub">発見 '+meta.gameovers.length+' / '+GOS.length+'</div>';
 for(var i=0;i<GOS.length;i++){var g=GOS[i],ok=meta.gameovers.indexOf(g[0])>=0;h+='<div class="row"><strong>'+(ok?g[0]+'　'+g[1]:'🔒　????????')+'</strong></div>'}
 h+='<button class="choice" onclick="renderArchive()">ENDING ARCHIVE</button><button class="choice" onclick="renderTitle()">閉じる</button></div>';document.getElementById("app").innerHTML=h;
}
function renderMenu(){
 document.getElementById("app").innerHTML='<div class="frame menu"><div class="screen-title">MENU</div><button class="choice" onclick="render()">ゲームへ戻る</button><button class="choice" onclick="renderSave()">セーブ</button><button class="choice" onclick="renderLoad()">ロード</button><button class="choice" onclick="renderItems()">アイテム</button><button class="choice" onclick="renderArchive()">ENDING ARCHIVE</button><button class="choice" onclick="renderGameOvers()">GAME OVER COLLECTION</button><button class="choice" onclick="renderTitle()">タイトルへ戻る</button></div>';
}

function bindTitleButtons(){
 var b;
 b=document.getElementById("btn-start"); if(b) b.addEventListener("click",function(e){e.preventDefault();newGame();});
 b=document.getElementById("btn-archive"); if(b) b.addEventListener("click",function(e){e.preventDefault();renderArchive();});
 b=document.getElementById("btn-save"); if(b) b.addEventListener("click",function(e){e.preventDefault();renderSave();});
 b=document.getElementById("btn-load"); if(b) b.addEventListener("click",function(e){e.preventDefault();renderLoad();});
}
function handleHashFallback(){
 var h=location.hash;
 if(h==="#game-start") newGame();
 else if(h==="#archive") renderArchive();
 else if(h==="#save") renderSave();
 else if(h==="#load") renderLoad();
}
window.addEventListener("hashchange",handleHashFallback);
window.addEventListener("load",function(){bindTitleButtons();handleHashFallback();});

</script>
